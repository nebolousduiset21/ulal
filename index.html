<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>বন্ধুবান্ধব</title>

    <!-- Bengali font -->
    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet"
    >

    <style>

        /* =====================================================
           BASIC RESET
        ===================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            overflow: hidden;
            background: #0c0b0a;
            color: #e8dfcf;
            font-family: "Noto Sans Bengali", sans-serif;
        }


        /* =====================================================
           MAIN SCREEN
        ===================================================== */

        .scene {
            position: relative;

            width: 100%;
            height: 100vh;
            height: 100svh;

            overflow: hidden;

            background:
                radial-gradient(
                    circle at 75% 35%,
                    #302c29 0%,
                    transparent 35%
                ),

                radial-gradient(
                    circle at 10% 100%,
                    #382522 0%,
                    transparent 42%
                ),

                #0c0b0a;
        }


        /* =====================================================
           STAR FIELD
        ===================================================== */

        .stars {
            position: absolute;

            inset: -50px;

            pointer-events: none;

            opacity: 0.7;

            background-image:

                radial-gradient(
                    circle at 8% 15%,
                    #e8dfcf 0 1px,
                    transparent 1.5px
                ),

                radial-gradient(
                    circle at 18% 72%,
                    #e8dfcf 0 1px,
                    transparent 1.5px
                ),

                radial-gradient(
                    circle at 34% 28%,
                    #e8dfcf 0 1px,
                    transparent 1.5px
                ),

                radial-gradient(
                    circle at 48% 81%,
                    #e8dfcf 0 1px,
                    transparent 1.5px
                ),

                radial-gradient(
                    circle at 62% 17%,
                    #e8dfcf 0 1px,
                    transparent 1.5px
                ),

                radial-gradient(
                    circle at 76% 62%,
                    #e8dfcf 0 1px,
                    transparent 1.5px
                ),

                radial-gradient(
                    circle at 91% 22%,
                    #e8dfcf 0 1px,
                    transparent 1.5px
                );
        }


        /* =====================================================
           MOON
        ===================================================== */

        .moon {
            position: absolute;

            width: min(55vw, 600px);
            aspect-ratio: 1;

            right: -12%;
            top: 8%;

            border-radius: 50%;

            opacity: 0.55;

            background:
                radial-gradient(
                    circle at 32% 30%,
                    #88827a 0%,
                    #514c47 25%,
                    #292623 55%,
                    #100f0e 75%
                );

            box-shadow:
                inset -50px -20px 100px #000;

            pointer-events: none;
        }


        /* Moon craters */

        .moon::before {
            content: "";

            position: absolute;

            inset: 0;

            border-radius: 50%;

            background:

                radial-gradient(
                    circle at 27% 40%,
                    #161412 0 4%,
                    transparent 4.5%
                ),

                radial-gradient(
                    circle at 63% 27%,
                    #171513 0 5%,
                    transparent 5.5%
                ),

                radial-gradient(
                    circle at 58% 67%,
                    #11100f 0 7%,
                    transparent 7.5%
                ),

                radial-gradient(
                    circle at 35% 73%,
                    #756e66 0 3%,
                    transparent 3.5%
                );
        }


        /* =====================================================
           ORBIT
        ===================================================== */

        .orbit {
            position: absolute;

            width: 80vw;
            height: 43vw;

            max-height: 480px;

            left: 12%;
            top: 22%;

            border: 1px solid #e8dfcf22;

            border-radius: 50%;

            transform: rotate(-22deg);

            pointer-events: none;
        }

        .orbit::after {
            content: "";

            position: absolute;

            width: 7px;
            height: 7px;

            border-radius: 50%;

            background: #a92e32;

            left: 18%;
            top: 18%;

            box-shadow:
                0 0 15px #a92e32;
        }


        /* =====================================================
           TOP INFORMATION
        ===================================================== */

        .top-bar {
            position: absolute;

            top: 0;
            left: 0;
            right: 0;

            height: 58px;

            padding: 0 24px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            border-bottom: 1px solid #ffffff18;

            color: #8e887f;

            font-family: monospace;
            font-size: 10px;

            letter-spacing: 3px;

            pointer-events: none;
        }

        .top-bar .red {
            color: #b92e34;
        }


        /* =====================================================
           LITTLE SIDE NOTE
        ===================================================== */

        .side-note {
            position: absolute;

            left: 5%;
            top: 23%;

            color: #817b73;

            font-family: monospace;
            font-size: 9px;

            line-height: 2;

            letter-spacing: 3px;

            pointer-events: none;
        }

        .side-note::after {
            content: "";

            display: block;

            width: 55px;
            height: 1px;

            margin-top: 12px;

            background: #a92e32;
        }


        /* =====================================================
           CENTER CROSSHAIR
        ===================================================== */

        .crosshair {
            position: absolute;

            left: 50%;
            top: 50%;

            width: 90px;
            height: 90px;

            border: 1px solid #a92e3238;

            border-radius: 50%;

            transform: translate(-50%, -50%);

            pointer-events: none;
        }

        .crosshair::before {
            content: "";

            position: absolute;

            width: 130px;
            height: 1px;

            background: #a92e3260;

            left: -20px;
            top: 44px;
        }

        .crosshair::after {
            content: "";

            position: absolute;

            width: 1px;
            height: 130px;

            background: #a92e3260;

            left: 44px;
            top: -20px;
        }


        /* =====================================================
           GIFT CONTAINER
        ===================================================== */

        .gift-wrapper {
            position: absolute;

            left: 50%;
            top: 50%;

            width: 270px;
            height: 200px;

            transform: translate(-50%, -50%);

            z-index: 20;

            pointer-events: none;

            animation:
                gift-arrive
                3.5s
                cubic-bezier(.18,.72,.22,1)
                forwards;
        }


        /* Gift arrives from LEFT-MIDDLE */

        @keyframes gift-arrive {

            0% {
                left: -25%;
                transform:
                    translate(-50%, -50%)
                    rotate(-9deg);
            }

            65% {
                left: 52%;
                transform:
                    translate(-50%, -50%)
                    rotate(4deg);
            }

            82% {
                left: 49%;
                transform:
                    translate(-50%, -50%)
                    rotate(-2deg);
            }

            100% {
                left: 50%;
                transform:
                    translate(-50%, -50%)
                    rotate(0deg);
            }
        }


        /* =====================================================
           THE ACTUAL CLICKABLE GIFT
        ===================================================== */

        .gift {
            position: absolute;

            left: 50%;
            bottom: 0;

            width: 250px;
            height: 145px;

            transform: translateX(-50%);

            border: none;

            background: transparent;

            cursor: pointer;

            pointer-events: auto;

            z-index: 30;
        }

        .gift:focus {
            outline: none;
        }


        /* =====================================================
           BOX
        ===================================================== */

        .box {
            position: absolute;

            left: 0;
            right: 0;
            bottom: 0;

            height: 115px;

            background:
                repeating-linear-gradient(
                    135deg,
                    #ffffff00 0 18px,
                    #ffffff0a 19px 20px
                ),

                #922a2e;

            border: 1px solid #c75952;

            box-shadow:
                8px 11px 0 #0009,

                inset 0 0 30px #350b0d;
        }


        /* Vertical ribbon */

        .ribbon-vertical {
            position: absolute;

            top: 0;
            bottom: 0;

            left: 42%;

            width: 16%;

            background: #d7c292;

            box-shadow:
                inset 3px 0 #fff4,
                inset -3px 0 #0002;
        }


        /* Horizontal ribbon */

        .ribbon-horizontal {
            position: absolute;

            left: 0;
            right: 0;

            top: 40%;

            height: 18%;

            background: #d7c292;

            box-shadow:
                inset 0 3px #fff3,
                inset 0 -3px #0002;
        }


        /* =====================================================
           GIFT LID
        ===================================================== */

        .lid {
            position: absolute;

            z-index: 50;

            left: -8px;
            right: -8px;

            top: -17px;

            height: 30px;

            background: #b53a3c;

            border: 1px solid #dc7065;

            box-shadow:
                4px 7px 0 #0007;

            transform-origin: left bottom;

            transition:
                transform .8s
                cubic-bezier(.2,.8,.2,1);
        }


        /* =====================================================
           BOW
        ===================================================== */

        .bow {
            position: absolute;

            z-index: 60;

            left: 50%;
            top: -47px;

            width: 60px;
            height: 40px;

            transform: translateX(-50%);

            transition:
                opacity .25s ease,
                transform .5s ease;
        }

        .bow::before,
        .bow::after {
            content: "";

            position: absolute;

            width: 28px;
            height: 27px;

            top: 2px;

            border: 5px solid #d7c292;

            border-radius:
                70%
                20%
                70%
                20%;
        }

        .bow::before {
            left: 0;

            transform: rotate(25deg);
        }

        .bow::after {
            right: 0;

            transform:
                scaleX(-1)
                rotate(25deg);
        }


        /* =====================================================
           CLICK HINT
        ===================================================== */

        .click-hint {
            position: absolute;

            left: 50%;
            top: calc(50% + 145px);

            transform: translateX(-50%);

            z-index: 25;

            color: #d7cfc1;

            text-align: center;

            font-family: monospace;

            font-size: 10px;

            letter-spacing: 3px;

            opacity: 0;

            animation:
                hint-appear
                .6s
                ease
                3.5s
                forwards;

            pointer-events: none;
        }

        .click-hint span {
            display: block;

            margin-top: 10px;

            color: #b92e34;

            font-size: 9px;

            letter-spacing: 2px;
        }

        @keyframes hint-appear {
            to {
                opacity: 1;
            }
        }


        /* =====================================================
           OPENING THE GIFT
        ===================================================== */

        .scene.opened .lid {
            transform:
                rotate(-115deg)
                translateY(-8px);
        }

        .scene.opened .bow {
            opacity: 0;

            transform:
                translateX(-50%)
                translateY(-20px);
        }

        .scene.opened .click-hint {
            opacity: 0;
        }


        /* =====================================================
           FIRST MESSAGE
        ===================================================== */

        .first-message {
            position: absolute;

            z-index: 40;

            left: 50%;
            top: 50%;

            width: min(88vw, 850px);

            padding: 20px 25px;

            background: #e8dfcf;

            color: #211e1a;

            text-align: center;

            border: 1px solid #fff4db;

            box-shadow:
                8px 10px 0 #0009;

            clip-path:
                polygon(
                    1% 3%,
                    98% 0,
                    100% 94%,
                    97% 100%,
                    0 96%
                );

            opacity: 0;

            visibility: hidden;

            transform:
                translate(-50%, -50%)
                scale(.15)
                rotate(-5deg);

            pointer-events: none;
        }

        .first-message .label {
            margin-bottom: 8px;

            color: #a92e32;

            font-family: monospace;

            font-size: 8px;

            letter-spacing: 3px;
        }

        .first-message p {
            font-size: clamp(19px, 3vw, 38px);

            font-weight: 900;

            line-height: 1.8;
        }


        /* The note comes OUT of the gift */

        .scene.opened .first-message {
            visibility: visible;

            animation:
                note-comes-out
                2.2s
                cubic-bezier(.15,.8,.2,1)
                forwards;
        }

        @keyframes note-comes-out {

            0% {
                top: 50%;

                opacity: 0;

                transform:
                    translate(-50%, -50%)
                    scale(.15)
                    rotate(-5deg);
            }

            25% {
                top: 44%;

                opacity: 1;

                transform:
                    translate(-50%, -50%)
                    scale(1.04)
                    rotate(2deg);
            }

            38% {
                top: 45%;

                transform:
                    translate(-50%, -50%)
                    scale(.98)
                    rotate(-1deg);
            }

            100% {
                top: 88%;

                opacity: 1;

                transform:
                    translate(-50%, -50%)
                    scale(1)
                    rotate(-1deg);
            }
        }


        /* =====================================================
           FINAL MESSAGE
        ===================================================== */

        .final-message {
            position: absolute;

            inset: 0;

            z-index: 100;

            display: grid;

            place-items: center;

            padding: 20px;

            visibility: hidden;

            opacity: 0;

            pointer-events: none;
        }

        .final-content {
            position: relative;

            width: 100%;

            text-align: center;

            transform:
                scale(.01)
                rotate(-12deg);

            filter: blur(18px);
        }

        .final-label {
            display: inline-block;

            margin-bottom: 22px;

            padding: 7px 12px;

            border: 1px solid #b92e34;

            color: #d9615e;

            font-family: monospace;

            font-size: 9px;

            letter-spacing: 3px;

            transform: rotate(-2deg);
        }

        .final-content h1 {
            color: #e8dfcf;

            font-size: clamp(
                29px,
                6.5vw,
                82px
            );

            font-weight: 900;

            line-height: 1.55;

            letter-spacing: -2px;

            text-shadow:
                4px 4px 0 #a92e32,
                9px 9px 0 #000;
        }


        /* Red lines behind final message */

        .final-content::before,
        .final-content::after {
            content: "";

            position: absolute;

            z-index: -1;

            left: 50%;
            top: 50%;

            width: min(90vw, 950px);

            height: 1px;

            background: #b92e32;

            box-shadow:
                0 0 25px #b92e3277;
        }

        .final-content::before {
            transform:
                translate(-50%, -50%)
                rotate(18deg);
        }

        .final-content::after {
            transform:
                translate(-50%, -50%)
                rotate(-18deg);
        }


        /* Sudden reveal */

        .scene.revealed .final-message {
            visibility: visible;

            animation:
                final-appear
                .12s
                steps(2)
                forwards;
        }

        .scene.revealed .final-content {
            animation:
                final-explosion
                .75s
                cubic-bezier(.12,.9,.25,1.2)
                forwards;
        }

        @keyframes final-appear {
            to {
                opacity: 1;
            }
        }

        @keyframes final-explosion {

            0% {
                transform:
                    scale(.01)
                    rotate(-12deg);

                filter: blur(18px);
            }

            48% {
                transform:
                    scale(1.15)
                    rotate(2deg);

                filter: blur(0);
            }

            70% {
                transform:
                    scale(.94)
                    rotate(-1deg);
            }

            100% {
                transform:
                    scale(1)
                    rotate(0);

                filter: blur(0);
            }
        }


        /* =====================================================
           REPLAY BUTTON
        ===================================================== */

        .replay {
            position: absolute;

            right: 4%;
            top: 75px;

            z-index: 200;

            padding: 10px 14px;

            color: #d8d0c1;

            background: #0c0b0ed9;

            border: 1px solid #e8dfcf55;

            font-family: monospace;

            font-size: 9px;

            letter-spacing: 2px;

            cursor: pointer;
        }

        .replay:hover {
            border-color: #b92e32;

            color: white;
        }


        /* =====================================================
           BOTTOM STATUS
        ===================================================== */

        .footer {
            position: absolute;

            left: 5%;
            right: 5%;
            bottom: 4%;

            z-index: 150;

            display: flex;

            align-items: center;

            gap: 14px;

            color: #817b73;

            font-family: monospace;

            font-size: 9px;

            letter-spacing: 2px;

            pointer-events: none;
        }

        .footer-line {
            flex: 1;

            height: 1px;

            background: #b92e3250;
        }

        .status {
            color: #b92e32;

            white-space: nowrap;
        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 600px) {

            .top-bar {
                padding: 0 13px;

                font-size: 8px;

                letter-spacing: 1px;
            }

            .side-note {
                top: 17%;
                left: 5%;

                font-size: 7px;

                letter-spacing: 2px;
            }

            .moon {
                width: 90vw;

                right: -35%;

                top: 18%;
            }

            .gift-wrapper {
                width: 230px;
            }

            .gift {
                width: 220px;
            }

            .click-hint {
                top: calc(50% + 135px);

                font-size: 8px;
            }

            .first-message {
                width: 92vw;

                padding: 15px 10px;
            }

            .first-message p {
                font-size: clamp(
                    16px,
                    4.5vw,
                    25px
                );
            }

            .final-content h1 {
                font-size: clamp(
                    27px,
                    8vw,
                    48px
                );

                letter-spacing: -1px;
            }

            .final-label {
                font-size: 7px;

                letter-spacing: 2px;
            }

            .replay {
                top: 65px;

                font-size: 8px;
            }

            .footer {
                left: 4%;
                right: 4%;

                font-size: 7px;
            }
        }

    </style>
</head>


<body>

<main class="scene" id="scene">

    <!-- Background -->

    <div class="stars"></div>

    <div class="moon"></div>

    <div class="orbit"></div>

    <div class="crosshair"></div>


    <!-- Header -->

    <header class="top-bar">

        <div>
            <span class="red">●</span>
            &nbsp; BEBOHAR.exe
        </div>

        <div>
            UNWRAPPED / 001
        </div>

    </header>


    <!-- Decorative writing -->

    <div class="side-note">

        SOME PEOPLE<br>
        ARE JUST<br>
        TEMPORARY<br>
        ORBITS
    </div>


    <!-- =================================================
         GIFT
    ================================================== -->

    <div class="gift-wrapper" id="giftWrapper">

        <!-- IMPORTANT:
             This button is the actual clickable object.
        -->

        <button
            class="gift"
            id="gift"
            aria-label="Open the gift"
            type="button"
        >

            <div class="box">

                <div class="ribbon-vertical"></div>

                <div class="ribbon-horizontal"></div>

                <!-- CLOSED LID -->

                <div
                    class="lid"
                    id="lid"
                ></div>

                <!-- BOW -->

                <div class="bow"></div>

            </div>

        </button>

    </div>


    <!-- =================================================
         CLICK MESSAGE
    ================================================== -->

    <div
        class="click-hint"
        id="clickHint"
    >

        SOMETHING IS WAITING INSIDE

        <span>
            ↓ CLICK THE WRAPPER ↓
        </span>

    </div>


    <!-- =================================================
         FIRST MESSAGE
         THIS IS INVISIBLE UNTIL THE GIFT IS CLICKED.
    ================================================== -->

    <section
        class="first-message"
        id="firstMessage"
    >

        <div class="label">
            A NOTE FROM INSIDE
        </div>

        <p>
            এই ব্যবহার নাহ ভাইয়া<br>
            ঠিক আছে, বন্ধুবান্ধব চিনলাম
        </p>

    </section>


    <!-- =================================================
         FINAL MESSAGE
    ================================================== -->

    <section
        class="final-message"
        id="finalMessage"
    >

        <div class="final-content">

            <div class="final-label">
                motherfucking piece of shit 
            </div>

            <h1>
                আবালি মাগি<br>
                বনেদি মাগি<br>
                বাসিচুদি বেশ্যা মাগি

            </h1>

        </div>

    </section>


    <!-- =================================================
         REPLAY
    ================================================== -->

    <button
        class="replay"
        id="replay"
        type="button"
    >
        
    </button>


    <!-- Bottom status -->

    <footer class="footer">

        <span>NO. 01</span>

        <div class="footer-line"></div>

        <span
            class="status"
            id="status"
        >
            WAITING FOR YOU
        </span>

    </footer>

</main>


<script>

/* =====================================================
   ELEMENTS
===================================================== */

const scene =
    document.getElementById("scene");

const gift =
    document.getElementById("gift");

const replay =
    document.getElementById("replay");

const status =
    document.getElementById("status");

const clickHint =
    document.getElementById("clickHint");


/* =====================================================
   STATE
===================================================== */

let opened = false;

let revealTimer = null;


/* =====================================================
   OPEN THE GIFT
===================================================== */

function openGift() {

    /*
       Prevent multiple clicks.
    */

    if (opened) {
        return;
    }

    opened = true;


    /*
       Open the lid.
    */

    scene.classList.add("opened");


    /*
       Remove the click instruction.
    */

    clickHint.style.display = "none";


    /*
       Update status.
    */

    status.textContent =
        "MESSAGE RELEASED";


    /*
       Wait.

       The first message comes out,
       slides down,
       and stays there.

       Then, after 8 seconds,
       the second message suddenly appears.
    */

    revealTimer = setTimeout(
        function () {

            scene.classList.add("revealed");

            status.textContent =
                "SOMETHING WENT WRONG";

        },
        8000
    );
}


/* =====================================================
   CLICK HANDLER
===================================================== */

/*
   This is deliberately attached directly
   to the gift button.

   Clicking ANYWHERE on the box opens it.
*/

gift.addEventListener(
    "click",
    openGift
);


/* =====================================================
   KEYBOARD SUPPORT
===================================================== */

gift.addEventListener(
    "keydown",
    function (event) {

        if (
            event.key === "Enter" ||
            event.key === " "
        ) {

            event.preventDefault();

            openGift();
        }

    }
);


/* =====================================================
   RESET EVERYTHING
===================================================== */

function resetExperience() {

    /*
       Stop any previous timer.
    */

    clearTimeout(revealTimer);


    /*
       Reset state.
    */

    opened = false;


    /*
       Remove animation states.
    */

    scene.classList.remove(
        "opened",
        "revealed"
    );


    /*
       Show click message again.
    */

    clickHint.style.display = "block";


    /*
       Reset status.
    */

    status.textContent =
        "WAITING FOR YOU";


    /*
       Restart gift entrance animation.

       Without this forced reflow,
       browsers can sometimes refuse
       to replay a CSS animation.
    */

    const wrapper =
        document.getElementById(
            "giftWrapper"
        );

    wrapper.style.animation = "none";

    void wrapper.offsetWidth;

    wrapper.style.animation =
        "gift-arrive 3.5s cubic-bezier(.18,.72,.22,1) forwards";
}


/* =====================================================
   REPLAY BUTTON
===================================================== */

replay.addEventListener(
    "click",
    resetExperience
);

</script>
